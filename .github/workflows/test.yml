# Runs the tests in this repository on each push and pull request, offline.
# production-source/excluded-tests.md lists the ones that cannot run here, and why.
#
# No secrets are used and no CoinMarketCap call is made:
# - the demo runs in fixture mode (CMC_MODE=fixture, no key), and its tests
#   inject synthetic responses;
# - the production-source Deno tests run without --allow-net, so any network
#   call from a test would fail rather than reach a provider;
# - the production-source Vitest tests hand the code under test a fake network,
#   and test-support/vitest-offline.mjs replaces the network globals (fetch,
#   WebSocket, XMLHttpRequest, EventSource) with ones that fail a test that
#   reaches past it.
# The only downloads are the npm packages in package-lock.json and, in their
# own step before the tests, the modules the Deno tests import: the Deno
# standard library and @supabase/supabase-js. The Deno tests then run from that
# cache only (--cached-only) and without network permission.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CMC_MODE: fixture
      CMC_API_KEY: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install (exact lockfile)
        run: npm ci

      - name: Demo tests (node --test, fixture mode)
        run: npm test

      - name: Demo build
        run: npm run build

      # The React frontend's tests in production-source/ (Vitest). The packaging
      # script writes the ones that run here to
      # production-source/runnable-vitest-tests.txt, and every other one, with the
      # reason, to production-source/excluded-tests.md. test-support/vitest.config.mjs
      # applies the stand-in map in test-support/deno.json (see the Deno steps
      # below), and the script runs Vitest from inside production-source/, which
      # has the private repository's layout.
      - name: Production-source frontend tests (Vitest, network globals refused)
        run: npm run test:vitest

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.8.2

      # production-source/ holds all of Investor Intel. The packaging script writes
      # the Deno tests that run here to production-source/runnable-tests.txt, and
      # every other one, with the reason, to production-source/excluded-tests.md.
      # Some Intel modules import a module of the private parent platform, which is
      # not in this repository. test-support/deno.json maps such an import, for
      # these tests only, to a TEST STAND-IN in test-support/stand-ins/ that only
      # lets the module load: every export throws when used, and any use fails
      # the run. The published source is unchanged.
      - name: Fetch the Deno test dependencies
        run: deno cache --config test-support/deno.json $(cat production-source/runnable-tests.txt)

      # --no-check runs the tests without a TypeScript type-check pass, the same
      # way the private repository runs these modules' tests.
      - name: Production-source tests (Deno, cache only, no network permission)
        run: deno test --config test-support/deno.json --cached-only --allow-read --allow-env --no-check $(cat production-source/runnable-tests.txt)
